id: pmjay
name:
  en: Ayushman Bharat PM-JAY
  hi: आयुष्मान भारत प्रधानमंत्री जन आरोग्य योजना (PM-JAY)
jurisdiction: national
states_excluded: []
care_types:
- inpatient
not_for:
- outpatient
- diagnostics
priority: hospital_cover
eligibility_signals:
- fact: ayushman_card_held
  equals: 'yes'
may_cover:
  en:
  - Cashless hospital care (secondary, tertiary, day-care procedures) at empanelled hospitals
  - Pre-existing diseases covered from the first day; up to 3 days before and 15 days after hospitalisation
  hi:
  - सूचीबद्ध अस्पतालों में कैशलेस अस्पताल इलाज (सेकेंडरी, टर्शियरी, डे-केयर प्रक्रियाएँ)
  - पहले से मौजूद बीमारियाँ पहले दिन से शामिल; भर्ती से 3 दिन पहले और 15 दिन बाद तक
does_not_cover:
  en:
  - Out-patient (OPD) visits
  - Tests on their own, not linked to a hospital stay
  hi:
  - ओपीडी (बिना भर्ती) दिखाना
  - भर्ती के बिना अलग से जाँचें
to_confirm:
  en:
  - Whether the family is a PM-JAY beneficiary (Ayushman card)
  hi:
  - क्या परिवार PM-JAY लाभार्थी है (आयुष्मान कार्ड)
not_applicable_note:
  en: PM-JAY does not pay for an ordinary out-patient visit or for tests on their own.
  hi: PM-JAY साधारण ओपीडी दिखाने या अलग से जाँच का पैसा नहीं देती।
documents:
