may_cover:
  en:
  - 'At public health facilities: free delivery including C-section, free drugs and consumables, free diagnostics, free diet during the stay, free blood, no user charges'
  - Free transport from home to the facility, between facilities on referral, and back home
  - Similar free entitlements for sick infants up to one year of age
  hi:
  - 'सरकारी स्वास्थ्य केंद्रों पर: मुफ़्त प्रसव (सिज़ेरियन सहित), मुफ़्त दवाइयाँ और सामान, मुफ़्त जाँच, रुकने के दौरान मुफ़्त भोजन, मुफ़्त खून, कोई शुल्क नहीं'
  - घर से केंद्र, रेफ़र होने पर एक केंद्र से दूसरे, और वापस घर तक मुफ़्त परिवहन
  - एक साल तक के बीमार शिशुओं के लिए भी ऐसी ही मुफ़्त सुविधाएँ
