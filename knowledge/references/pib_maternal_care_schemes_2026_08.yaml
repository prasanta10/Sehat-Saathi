excerpts:
- locator: JSSK
  text: Janani Shishu Suraksha Karyakram (JSSK) entitles all pregnant women deliver in public health institutions to have absolutely free and no expense delivery, including caesarean section.
- locator: JSSK sick infants
  text: Similar entitlements are also in place for sick infants up to one year of age.
- locator: SUMAN
  text: Surakshit Matritva Aashwasan (SUMAN) provides assured, dignified, respectful and quality healthcare at no cost and zero tolerance for denial of services for every pregnant woman and newborn visiting
    public health facilities to end all preventable maternal and newborn deaths.
- locator: PMMVY
  text: cash incentives of ₹5,000/- are provided directly to the Bank/ Post Office account of the beneficiary in Direct Benefit Transfer (DBT) mode for the first child.
