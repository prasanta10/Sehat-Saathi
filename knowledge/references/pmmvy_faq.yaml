excerpts:
- locator: Q3 eligibility
  text: Women belonging to scheduled castes and scheduled tribes … Women holder of BPL ration Card … Women Beneficiaries under Pradhan Mantri Jan Aarogya Yojana (PMJAY) under Ayushman Bharat … Women holding
    MGNREGA Job Card … Women whose net family income is less than ₹8 Lakh per annum … Women holding Ration Card under NFSA Act 2013
- locator: Q13 states not implementing
  text: Currently, the scheme is not being implemented in Telangana and Odisha as they are implementing their own respective maternity benefit schemes.
- locator: Q21 documents
  text: Beneficiaries need documents such as their Aadhaar card, Aadhaar mapped bank/post office account details, mobile number, eligibility proof, MCP/RCHI card, LMP date, ANC date, child birth certificate,
    child immunization details etc.
notes: Mission Shakti guidelines (2022) differ from this FAQ on ANC count and registration deadline; those details are not shown.
