- locator: Ni-kshay Poshan Yojana amount
  text: For nutrition support, from 1st November, 2024, the Government has doubled the financial assistance under Ni-kshay Poshan Yojana (NPY) to TB patients from Rs 500 to Rs 1,000 per month per patient,
    for the entire duration of treatment.
