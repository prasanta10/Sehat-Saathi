excerpts:
  - locator: "p. 22 (pdf 48), Table 3.3: Criteria for Danger Signs in newborn"
    text: "Table 3.3: Criteria for Danger Signs in newborn … Movement only when stimulated … or no movement at all … Severe chest indrawing … Yellow discolouration in … Not able to feed … palm and feet … Blood in stool … Convulsion … Axillary temperature 37.5º C … Difficulty in breathing … or above (feels hot to touch) … Fast breathing (more than 60 … Axillary temperature less than … breaths per minute) … 36º C (feels cold to touch)"
  - locator: "p. 23 (pdf 49), Table 3.5: Criteria for Danger Signs in Young Child"
    text: "Table 3.5: Criteria for Danger Signs in Young Child … Not able to feed/drink … Fever (more than 37.5º C or … 99.5º F) more than 7 days and … no doctor consultation taken … Vomits everything often … Diarrhoea more than 14 days … Lethargy/ unconsciousness … Convulsions/convulsing now … Blood in stools … Difficulty in breathing … Fast breathing (2 months to 12 … months: more than 50 breaths … per minute; 12 months to 5 years: … Severe chest in-drawing … more than 40 breath per minute)"
  - locator: "p. 23 (pdf 49), text after Table 3.4"
    text: "presence of danger signs necessitates prompt clinical assessment, pre referral stabilization, and immediate referral"
  - locator: "p. 28 (pdf 54), Figure 3.5: Maternal Danger Signs"
    text: "Figure 3.5: Maternal Danger Signs … Excessive … Convulsions … Bleeding … Fever … Severe … abdominal pain … Difficulty in … breathing"
  - locator: "p. 4 (pdf 30), Figure 1.1: Antenatal Care"
    text: "Antenatal Care … Pregnancy registration in first trimester & issue of digital MCH … Screening & treatment for High-Risk Pregnancies like Severe Anemia, … hypertension & infections (syphilis, malaria, TB, HIV etc.), GDM, … Hepatitis B, bad obstetric history, teenage pregnancy and others … 5 ANC visits for normal pregnant woman (including PMSMA visit) … 8 ANC visits for high-risk pregnant woman (3 additional visits … under E-PMSMA) … Identification of danger signs & early referral"
  - locator: "p. 43 (pdf 69), Table 4.3: ASHA role in birth preparedness"
    text: "Check and confirm if the … mother is a High-Risk … Pregnancy (HRP) and if yes, … referred to FRU for delivery"
  - locator: "p. 48 (pdf 74), Table 4.5: Tasks for ASHAs for Young Children, prompt referral of sick child"
    text: "Table 4.5: Tasks for ASHAs and AWWs for Young Children (6 weeks to 36 months) … Identification and prompt referral of sick child"
  - locator: "p. 116 (pdf 142), Form 6 (ASHA, 2–36 months): danger signs and referral place"
    text: "For Age 2 months to 36 months – Reporting Format (FORM 6) … Ask and Observe danger signs- (Multiple option selection) … (If “YES”, Referral Pop Up- PLACE of referral- For refer to … AAM/CHC/PHC/DH) … Diarrhoea more than 14 days (Signs of dehydration like … sunken eyes and skin pinch goes back slowly"
  - locator: "p. 116 (pdf 142), Form 5 (ASHA): underweight with medical complications, refer to NRC"
    text: "Underweight/ severe underweight with medical complications … (Pop up, Counsel & Refer to NRC in consultation with ANM/CHO … if Yes)"
  - locator: "pp. 125–126 (pdf 151–152), Form 2 (sick young child, CHO/ANM): cough for 21 days or more, refer"
    text: "FORM 2: Management of sick young child (2-36 months of age) by CHO/ANM … Any DANGER SIGN or … other problem to refer? … □ Cough? If yes, for how long? __ days … □ Cough for 21 days or … more … 2. Decide: Refer or treat child (tick decision) … □ If ANY Danger Sign or other … problem, refer to health facility … If any danger sign, … REFER URGENTLY to health facility:"
  - locator: "pp. 125–126 (pdf 151–152), Form 2 (sick young child, CHO/ANM): swelling of both feet, refer"
    text: "FORM 2: Management of sick young child (2-36 months of age) by CHO/ANM … Any DANGER SIGN or … other problem to refer? … □ Swelling of both feet? □ Swelling of both feet … 2. Decide: Refer or treat child (tick decision) … □ If ANY Danger Sign or other … problem, refer to health facility … If any danger sign, … REFER URGENTLY to health facility:"
  - locator: "p. 126 (pdf 152), Form 2 Decide: fever every day for more than 7 days"
    text: "2. Decide: Refer or treat child (tick decision) … If fever is present every day for more than 7 days, refer for assess- … ment"
  - locator: "p. 127 (pdf 153), Form 2 Decide: severe palmar pallor"
    text: "□ If Severe … □ Refer URGENT- … Palmar Pallor … LY to hospital … to assess the causes and … treat accord- … ingly"
  - locator: "p. 127 (pdf 153), Form 2 Decide: severe acute malnutrition (red on MCP card)"
    text: "□ If Severe Acute … Malnutrition … (WFL <-3 SD score: … red color on … MCP card) … Keep the child … warm on the … way to hospital."
  - locator: "p. 130 (pdf 156), Section 3 VHSND: counselling if danger signs present, signs of dehydration"
    text: "Counselling if danger signs present in newborns & children … Explain why newborn/ child needs to go to health facility. … If signs of dehydration (like sunken eyes and skin pinch goes back slowly), refer URGENTLY to hospital"
