- locator: Free Entitlements for pregnant women
  text: 'The following are the Free Entitlements for pregnant women: … Free and cashless delivery … Free C-Section … Free drugs and consumables … Free diagnostics … Free diet during stay in the health institutions
    … Free provision of blood … Exemption from user charges … Free transport from home to health institutions … Free transport between facilities in case of referral … Free drop back from Institutions to
    home after 48hrs stay'
