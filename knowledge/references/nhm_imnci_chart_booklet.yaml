excerpts:
  - locator: "p. 12 (pdf 14), Assess and classify the sick child 2 months up to 5 years: Check for general danger signs"
    text: "CHECK FOR GENERAL DANGER SIGNS … See if the child is lethargic or unconscious. … Is the child able to drink or breastfeed? … Does the child vomit everything? … Has the child had convulsions? … A child with any general danger sign needs URGENT attention; complete the assessment and … any pre-referral treatment immediately so referral is not delayed."
