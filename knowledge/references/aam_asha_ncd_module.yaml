  - locator: "Annexure 2 (pdf 68), CBAC Part B1 and action note"
    text: "Coughing more than 2 weeks* … Blood in sputum* … Fever for > 2 weeks* … Loss of weight* … Night Sweats* … History of TB * … In case of individual answers Yes to any one of the above-mentioned symptoms, refer the patient immediately to … the nearest facility where a Medical Officer is available … *If the response is Yes- action suggested: Sputum sample collection and transport to nearest TB testing center"
