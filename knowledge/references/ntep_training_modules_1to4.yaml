excerpts:
  - locator: "Module 2, p. 23 (pdf 39), Definitions: Presumptive Pulmonary TB"
    text: "Presumptive Pulmonary TB refers to a person with any of the symptoms and signs suggestive of TB, including: cough for 2 weeks or more, fever for 2 weeks or more, significant weight loss, haemoptysis, any abnormality in chest radiograph."
  - locator: "Module 2, p. 23 (pdf 39), Definitions: also to be investigated as presumptive PTB"
    text: "The following are also to be investigated as presumptive PTB … a. Contacts of Microbiologically confirmed TB patients having cough of any duration"
  - locator: "Module 2, p. 24 (pdf 40), Importance of properly identifying Presumptive TB cases"
    text: "every case of presumptive pulmonary TB should be referred for sputum examination"
