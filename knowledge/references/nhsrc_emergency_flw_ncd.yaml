  - locator: "slide 3 (pdf 3), Recognising life threatening situations - NCDs"
    text: "RECOGNISING LIFE THREATENING … 1. Sudden weakness in arms or legs (usually affects one side of the body) … 2. Sudden drooping or weakness in one side of the face … 3. Sudden loss of balance, headache, dizziness, or loss of consciousness … 4. Sudden blurring of vision … 5. Sudden difficulty in speech/inability to speak … 6. Sudden pain in the chest"
