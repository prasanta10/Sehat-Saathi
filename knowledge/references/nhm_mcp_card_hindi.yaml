excerpts:
  - locator: "pdf page 4, pregnancy danger signs (Hindi)"
    text: "यदि आपको अथवा आपके परिवार में किसी अन्य व्यक्ति को खतरे के ये लक्षण दिखाई दें तो गर्भवती महिला को तुरन्त अस्पताल ले जायें … गर्भावस्था के दौरान रक्तस्राव, प्रसव के दौरान अथवा प्रसव के पश्चात् अत्यधिक रक्तस्राव … गर्भावस्था अथवा प्रसव के एक महीने के भीतर तेज बुखार … दौरे पड़ना, धुंधला दिखाई देना, सिरदर्द, उल्टी, पूरे शरीर में सूजन … 12 घण्टे से अधिक समय तक प्रसव पीड़ा … प्रसव पीड़ा के बिना ही पानी की थैली फट जाना"
