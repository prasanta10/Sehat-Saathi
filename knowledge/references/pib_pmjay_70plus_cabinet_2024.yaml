excerpts:
- locator: 'release text: 70 years and above'
  text: With this approval, all senior citizens of the age 70 years and above irrespective of their socio- economic status would be eligible to avail the benefits of AB PM-JAY.
- locator: 'release text: cover for other senior citizens'
  text: All other senior citizens of the age 70 years and above will get a cover upto ₹5 lakh per year on a family basis.
