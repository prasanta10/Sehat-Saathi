notes: "Red flags are framed for people with TB; Box 2.1 assigns ASHA/family to check them 'Before diagnosis' too. Their use for undiagnosed adults with cough needs clinician confirmation."
excerpts:
  - locator: "p. 11 (pdf 23), 2.3.1 Systematic Triaging: red-flag criteria"
    text: "Red-flag criteria include the presence of signs and symptoms which are critically important, can be assessed at community level personnel and are to be mandatorily assessed at all levels of … • Patient confined to bed … • Breathlessness - at rest, speaks with difficulty-unable to complete a sentence without a pause, unable to take feed, on 10-15 feet walk or on attending nature’s call … • Severe pain: chest pain/abdominal pain … • Altered consciousness or convulsions or limb weakness … • Coughing out blood ≥ 1 cup … • Recurrent vomiting/ diarrhoea"
  - locator: "p. 11-12 (pdf 24), Box 2.1 Triaging framework"
    text: "Box 2.1 Differentiated TB Care (DTC) – Triaging framework … Before diagnosis"
  - locator: "p. 12 (pdf 25), Triaging process: referral of triage-positive patients"
    text: "Triage-positive patients are referred immediately to higher-level health facilities, such as CHCs or district hospitals, tertiary level health institutions for hospitalization and further assessment."
