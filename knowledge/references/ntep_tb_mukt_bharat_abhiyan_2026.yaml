excerpts:
  - locator: "pdf 7, Community-based services: b. Vulnerable Population"
    text: "b. Vulnerable Population - Vulnerable population includes individuals over 60 years … of age, individuals with malnutrition (BMI <18.5), diabetics, People Living with HIV … (PLHIV), smokers, alcoholics, persons with past history of TB disease and … household contacts of TB patients."
  - locator: "pdf 8, Facility-based intensified services: g. Screening using 10-Symptoms (10-S)"
    text: "Cough >2 weeks (Any duration for vulnerable population), Fever, Night … sweats, Hemoptysis, Chest pain, Shortness of breath, Weight loss, Loss of … appetite, Fatigue, Lymph node swelling and any other extra pulmonary"
  - locator: "pdf 8, h. Sample Collection and Transport"
    text: "Health workers (ASHA/CV) ensure proper … sputum sample collection and transportation to the nearest NAAT facility."
