[project]
name = "sehat-saathi"
version = "0.1.0"
description = "Referral-support assistant for frontline health workers (prototype; not clinically validated)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",  # assert is how pytest works
    "RUF001", "RUF002", "RUF003",  # Devanagari text is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app"]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
    "error",
    # Starlette suggests httpx2; httpx is still supported. Revisit when upgrading.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261111",
]
