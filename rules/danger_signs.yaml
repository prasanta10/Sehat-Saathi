# Universal danger signs: any one confirmed `yes` gives EMERGENCY, on every pathway and with
# no pathway. Transcribed from the cited official documents; labels follow the source wording.
# DRAFT: not clinically reviewed. Signs with no official source found are left out.
# English labels follow the source text; Hindi labels are draft translations except the
# pregnancy signs, which are copied from the official Hindi MCP card.
version: 0.1.0
review: {status: draft, reviewer: null, reviewed_on: null}
